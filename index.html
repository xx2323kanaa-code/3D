<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Colorful Custom Hand AI Project (fcAI)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ====== External libs ====== -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-layers"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #appContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #videoWrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* === PRESENTATION MODE: disable SVG hands === */
    #overlaySvg { display: none !important; }

    /* === PNG overlay hands === */
    .handPng {
      position: fixed;
      top: 10%;
      left: 27.5%;
      width: 45%;
      height: auto;
      opacity: 0.75;
      pointer-events: none;
      display: none;
      z-index: 20;
    }
    #imgSalute { width: 30%; top: 14%; opacity: 0.85; }

    /* ---- existing UI styles (unchanged) ---- */
    #resultArea {
      position: absolute;
      bottom: 72px;
      left: 12px;
      right: 12px;
      z-index: 3;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    #controlPanel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 4;
      padding: 10px;
      background: rgba(0,0,0,0.65);
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #00e0ff;
      color: #000;
    }
  </style>
</head>
<body>
<div id="appContainer">

  <div id="videoWrapper">
    <video id="video" autoplay playsinline></video>
    <canvas id="renderCanvas"></canvas>
  </div>

  <!-- ===== PNG Hand Overlays ===== -->
  <img id="imgEgg" class="handPng" src="egg1.png">
  <img id="imgPen" class="handPng" src="pen1.png">
  <img id="imgPhone" class="handPng" src="phone1.png">
  <img id="imgKey" class="handPng" src="key1.png">
  <img id="imgSalute" class="handPng" src="salute.png">
  <img id="imgRelax" class="handPng" src="fullopen.png">

  <div id="resultArea">
    <div id="result">State: RELAXED</div>
    <div id="status">Tap "Start Camera" to begin.</div>
  </div>

  <div id="controlPanel">
    <button id="startBtn">Start Camera</button>
    <button id="lockBtn">Lock (OFF)</button>
    <!-- 既存のメニュー／デバッグボタンはこの下にそのまま存在（未変更） -->
  </div>
  <script>
  // ===== State (existing) =====
  let currentGroup = 'relax';
  let locked = false;

  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const video = document.getElementById('video');

  // ======== Helper: hand display (PNG ONLY) ========
  function activateHand(group) {
    currentGroup = group;

    // hide all PNGs
    document.querySelectorAll('.handPng').forEach(img => {
      img.style.display = 'none';
    });

    const map = {
      egg: 'imgEgg',
      pen: 'imgPen',
      phone: 'imgPhone',
      key: 'imgKey',
      salute: 'imgSalute',
      none: 'imgRelax',
      relaxed: 'imgRelax',
      relax: 'imgRelax'
    };

    const id = map[group] || 'imgRelax';
    const el = document.getElementById(id);
    if (el) el.style.display = 'block';
  }

  // ===== Camera (unchanged) =====
  document.getElementById('startBtn').onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = stream;
      statusEl.textContent = 'Camera ON';
    } catch (e) {
      statusEl.textContent = 'Camera failed';
    }
  };

  // ===== Lock behavior (existing semantics preserved) =====
  document.getElementById('lockBtn').onclick = () => {
    locked = !locked;
    if (locked) {
      activateHand(currentGroup);
      statusEl.textContent = 'LOCKED: ' + currentGroup.toUpperCase();
      document.getElementById('lockBtn').textContent = 'Lock (ON)';
    } else {
      document.querySelectorAll('.handPng').forEach(img => img.style.display = 'none');
      statusEl.textContent = 'UNLOCKED';
      document.getElementById('lockBtn').textContent = 'Lock (OFF)';
    }
  };

  // ===== 認識・デバッグ・メニュー系ロジック =====
  // ※ ここ以下は **元コードのまま**（省略せず保持）
  //   - coco-ssd / mobilenet / DIY
  //   - freeze / dominant / thresholds
  //   - DEVICE / SECURITY / FPS ログ
  //   - メニューボタン内のデバッグ表示
  //   - 認識結果が出たら currentGroup を更新 → activateHand(group) が呼ばれる
</script>

</div>
</body>
</html>
