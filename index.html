<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Demo – Step 2</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #hero {
      width: 100%;
      height: auto;
      display: block;
    }

    #panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: #00e0ff;
      color: #000;
    }
  </style>
</head>

<body>

  <!-- 3D風・未来義手 静止画 -->
  <img id="hero" src="relax.png" alt="Future Hand">

  <!-- 下部パネル -->
  <div id="panel">
    <button id="startBtn">Start Demo</button>
    <div id="status" style="margin-top:8px;font-size:14px;opacity:0.8;">
      Ready
    </div>
  </div>

  <script>
    const btn = document.getElementById("startBtn");
    const status = document.getElementById("status");

    btn.addEventListener("click", () => {
      status.textContent = "Button OK (JS working)";
      console.log("STEP2: button clicked");
    });
  </script>

</body>
</html>
