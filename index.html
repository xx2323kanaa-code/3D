<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Demo – Step 3</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #hero {
      width: 100%;
      height: auto;
      display: block;
    }

    #video {
      width: 100%;
      height: auto;
      display: none;
    }

    #panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: rgba(0,0,0,0.6);
    }

    button {
      font-size: 16px;
      padding: 10px 18px;
      margin: 6px;
      border-radius: 10px;
      border: none;
      background: #00e0ff;
      color: #000;
    }
  </style>
</head>

<body>

  <!-- 静止画（最初に表示） -->
  <img id="hero" src="relax.png" alt="Future Hand">

  <!-- カメラ映像（最初は非表示） -->
  <video id="video" autoplay playsinline></video>

  <!-- 下の操作パネル -->
  <div id="panel">
    <button id="btnCamera">Start Camera</button>
    <button id="btnImage">Change Image</button>
    <div id="status" style="margin-top:8px;font-size:14px;">
      Ready
    </div>
  </div>

  <script>
    const hero   = document.getElementById("hero");
    const video  = document.getElementById("video");
    const status = document.getElementById("status");

    const btnCamera = document.getElementById("btnCamera");
    const btnImage  = document.getElementById("btnImage");

    let usingSalute = false;
    let cameraOn = false;

    // 画像切り替え
    btnImage.addEventListener("click", () => {
      usingSalute = !usingSalute;
      hero.src = usingSalute ? "salute.png" : "relax.png";
      status.textContent = "Image: " + (usingSalute ? "salute" : "relax");
    });

    // カメラ起動（必ずボタン操作）
    btnCamera.addEventListener("click", async () => {
      if (cameraOn) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";
        hero.style.display = "none";

        cameraOn = true;
        status.textContent = "Camera ON";
      } catch (e) {
        status.textContent = "Camera failed";
        alert("カメラを起動できませんでした");
      }
    });
  </script>

</body>
</html>
