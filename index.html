<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Future Hand Demo</title>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #overlay {
      position: absolute;
      top: 15%;
      left: 35%;
      width: 30%;
      opacity: 0.85;
      z-index: 2;
      pointer-events: none;
    }

    #panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: rgba(0,0,0,0.6);
      z-index: 3;
      text-align: center;
    }

    button {
      font-size: 16px;
      padding: 10px 16px;
      margin: 4px;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>

<body>

<div id="stage">
  <video id="video" autoplay playsinline></video>
  <img id="overlay" src="relax.png">
</div>

<div id="panel">
  <button id="btnCamera">Start Camera</button>
  <button id="btnImage">Change Image</button>
</div>

<script>
  const video   = document.getElementById("video");
  const overlay = document.getElementById("overlay");

  let salute = false;
  let cameraOn = false;

  document.getElementById("btnImage").onclick = () => {
    salute = !salute;
    overlay.src = salute ? "salute.png" : "relax.png";
  };

  document.getElementById("btnCamera").onclick = async () => {
    if (cameraOn) return;

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;
    cameraOn = true;
  };
</script>

</body>
</html>
